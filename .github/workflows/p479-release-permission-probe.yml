name: Diagnose P479 GitHub release API permission (NO RELEASE, NO FLASH)
on:
  push:
    branches:
      - agent/p479-release-permission-audit
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Non-mutating permission probe with deliberately invalid release payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Missing required tag_name ensures this request CANNOT create a
          # release. Authorized callers get HTTP 422; unauthorized callers 403.
          STATUS="$(curl -sS --retry 2 -o "$RUNNER_TEMP/release-permission-body.json" \
            -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data '{"name":"permission-probe-no-tag-cannot-create"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases")"
          echo "GitHub Actions release API probe HTTP $STATUS"
          python3 - "$RUNNER_TEMP/release-permission-body.json" <<'PY'
          from pathlib import Path
          import json,sys
          j=json.loads(Path(sys.argv[1]).read_text())
          print("API response message:",j.get("message","(none)"))
          PY
          if [ "$STATUS" = 422 ]; then
            echo 'GitHub token release POST reached validation (missing tag): permission likely write-capable' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$STATUS" = 403 ]; then
            echo 'Default integration token release POST denied 403. Use explicit P479_RELEASE_PAT (Contents RW, Actions R) for actual publication.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected release permission probe HTTP status: $STATUS"
            exit 1
          fi
