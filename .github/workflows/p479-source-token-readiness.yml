name: P479 source repository token readiness (READ ONLY, NO FLASH)
on:
  push:
    branches:
      - agent/p479-source-token-readiness-no-flash
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check token presence and auth without exposing credentials
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TARGET=GiulianoB-1/A526B-Mangrove-Source
          if gh repo view "$TARGET" --json name >/dev/null 2>&1; then
            echo 'Destination: repository already exists; must be EMPTY (no heads/tags)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Destination: not yet available to the standard GitHub App token' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$SOURCE_PUSH_TOKEN" ]; then
            echo 'SOURCE_REPO_PAT: MISSING. Native repository creation requires a user-provided credential. NO ACTION TAKEN.' >> "$GITHUB_STEP_SUMMARY"
            echo "P479 token readiness: SOURCE_REPO_PAT absent; no repo created"
            exit 0
          fi
          if GH_TOKEN="$SOURCE_PUSH_TOKEN" gh api /user --jq .login >/dev/null 2>&1; then
            echo 'SOURCE_REPO_PAT: PRESENT and basic GitHub authentication succeeded.' >> "$GITHUB_STEP_SUMMARY"
            echo "P479 token readiness: SOURCE_REPO_PAT present and authenticated; NO CHANGE"
          else
            echo 'SOURCE_REPO_PAT: PRESENT but invalid/insufficient for GitHub user API. No repo created.' >> "$GITHUB_STEP_SUMMARY"
            echo "P479 token readiness: SOURCE_REPO_PAT authentication failed; NO CHANGE"
          fi
          echo 'No secrets were printed, no pushes, no repo creation, NO FLASH.' >> "$GITHUB_STEP_SUMMARY"
          # Test REST auth/scope without printing a token or making changes.
          # POST is deliberately missing required \`sha\`, so it cannot create a ref.
          user_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            'https://api.github.com/user')"
          source_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$TARGET")"
          no_write_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"refs/heads/p479-scope-probe-without-sha"}' \
            "https://api.github.com/repos/$TARGET/git/refs")"
          printf 'P479 PAT read-only diagnosis: user HTTP %s, repository HTTP %s, deliberately invalid ref-write HTTP %s\n' \
            "$user_code" "$source_code" "$no_write_code"
          {
            echo "PAT /user API status: $user_code (200 = authentic)"
            echo "PAT destination visibility: $source_code (200 = visible)"
            echo "PAT write permission validation: $no_write_code (422 = request accepted then rejected for missing required SHA)"
            echo "No Git refs could be created because the request contained no SHA. NO PUSH. NO FLASH."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$user_code" = 200 ] && [ "$source_code" = 200 ] && [ "$no_write_code" = 422 ]; then
            echo 'P479 PAT credential and repository write-scope: READINESS PASS'
          else
            echo 'P479 PAT credential and/or repository write-scope: READINESS BLOCKED'
          fi

