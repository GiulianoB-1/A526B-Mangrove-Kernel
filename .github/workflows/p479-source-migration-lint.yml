name: Source migration lint (no source publication, no flash)
on:
  push:
    branches:
      - agent/p479-source-migration-prep
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check new gated recovery and source migration scripts
        run: |
          set -Eeuo pipefail
          bash -n scripts/452_apply_phase_chain_from_wx.sh
          bash -n scripts/recover_phase446wx_or_446s.sh
          bash -n migration/create_p479_source_baseline.sh
          python3 -m py_compile scripts/p479_equivalence_gate.py
          python3 -m py_compile migration/p479_kernelsu_direct.py
          python3 - <<'PY_KSU'
          import sys
          sys.path.insert(0,'migration')
          import p479_kernelsu_direct as m
          assert m.ORIGINAL_P479_KSU_VERSION == 35171
          assert m.ORIGINAL_P479_KSU_FULL == 'v4.2.0-rc3-239e1e88-dirty@ReSukiSU'
          assert 'LOCAL_GIT_EXISTS' not in m.REPLACEMENT
          assert 'KSU_LOCAL_VERSION := 4471' in m.REPLACEMENT
          assert 'KSU_COMMIT_SHA := 239e1e88-dirty' in m.REPLACEMENT
          print('KernelSU direct-source adaptation static safety PASS')
          PY_KSU
          python3 -m pip install --quiet --user PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for filename in ('migration/source-ci/direct-source-build.yml',
                           'migration/source-ci/source-safety-audit.yml',
                           '.github/workflows/p479-source-repo-cutover.yml'):
              obj=yaml.safe_load(Path(filename).read_text())
              assert 'jobs' in obj, filename
              print('lint PASS:', filename)
          PY
          echo 'Gated migration scripts and source-only workflows lint PASS. No repository created.' >> "$GITHUB_STEP_SUMMARY"
