name: Migrate equivalence-proven P479 into direct-source Git repo (NO FLASH)
on:
  # Manual dispatch may require this workflow on the default branch. The
  # explicit push marker works safely on the isolated migration branch.
  push:
    branches:
      - agent/p479-source-migration-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-source-cutover:
    # Never create a remote repository during ordinary source/migration pushes.
    # User must explicitly request the one-time cutover by committing the exact
    # [P479-CUTOVER] marker, after configuring a permitted secret.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[P479-CUTOVER]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout pinned migration procedure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight SOURCE_REPO_PAT against the exact EMPTY destination (NO MUTATION)
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_PUSH_TOKEN" || {
            echo '::error::SOURCE_REPO_PAT is missing. No changes made.'
            exit 1
          }
          TOKEN_USER_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user)"
          TOKEN_REPO_CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/GiulianoB-1/A526B-Mangrove-Source)"
          if [ "$TOKEN_USER_CODE" != 200 ] || [ "$TOKEN_REPO_CODE" != 200 ]; then
            printf '::error::SOURCE_REPO_PAT rejected: user HTTP %s, source repository HTTP %s. Regenerate token, no repository changed.\n' \
              "$TOKEN_USER_CODE" "$TOKEN_REPO_CODE"
            exit 1
          fi
          # This API request deliberately omits required commit SHA, so even a
          # write-authorized token can NEVER create the test branch.
          SCOPE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SOURCE_PUSH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data '{"ref":"refs/heads/p479-invalid-scope-probe-no-sha"}' \
            https://api.github.com/repos/GiulianoB-1/A526B-Mangrove-Source/git/refs)"
          case "$SCOPE_CODE" in
            409|422) ;; 
            *) echo "::error::SOURCE_REPO_PAT cannot write source refs (HTTP $SCOPE_CODE). No changes made."; exit 1 ;;
          esac
          echo 'SOURCE_REPO_PAT authenticated to exact target. No refs created by scope probe.'
      - name: Fetch permanent P479 source release, never an expiring artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd rsync
          mkdir -p p479-release p479-source-root
          gh release download p479-verified-source-baseline \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'P479*' --pattern SHA256SUMS \
            --dir p479-release
          (cd p479-release && sha256sum -c SHA256SUMS)
          # The release and its checksum file are in the same trust domain:
          # independently pin all four assets to the authenticated P479 run.
          cat > "$RUNNER_TEMP/p479-immutable-shasums.txt" <<'SHAS'
          43ecd5698f319328290721c4f79d1dddfe7e8acb30f4ba1c3a47629f2115d9e3  p479-release/P479-verified-full-source.tar.zst
          62e75568506c051408588d2eb77fa94fb8ada762fcff997739a5b595a742d50b  p479-release/P479.config
          1c55825c138aafa87808cc7cfab6effdce8b6e063b39fb9a8de86db90bf6ee55  p479-release/P479-equivalence-proof.json
          ff3bae1093dcf5fca3f2c2fa516000de69f677f9fc673dd38b9da378ffd085d4  p479-release/P479-final-tree-manifest.json
          SHAS
          sha256sum -c "$RUNNER_TEMP/p479-immutable-shasums.txt"
          tar --use-compress-program=zstd \
            -xf p479-release/P479-verified-full-source.tar.zst \
            -C p479-source-root
          test -s p479-source-root/Makefile
          test -d p479-source-root/KernelSU
          test ! -e p479-source-root/.git
          test ! -e p479-source-root/KernelSU/.git
      - name: Commit one complete P479 baseline and tag (only with explicit authorized token)
        env:
          SOURCE_PUSH_TOKEN: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_PUSH_TOKEN" || {
            echo '::error::SOURCE_REPO_PAT missing. Create an EMPTY GiulianoB-1/A526B-Mangrove-Source repository and supply a fine-grained PAT with Contents:write and Workflows:write for that repo, or use a short-lived classic PAT with repo+workflow scopes for repo creation. No repo created.'
            exit 1
          }
          export P479_SOURCE_ROOT="$PWD/p479-source-root"
          export P479_CONFIG="$PWD/p479-release/P479.config"
          export P479_FINAL_TREE_MANIFEST="$PWD/p479-release/P479-final-tree-manifest.json"
          export P479_EQUIVALENCE_REPORT="$PWD/p479-release/P479-equivalence-proof.json"
          bash -n migration/create_p479_source_baseline.sh
          bash migration/create_p479_source_baseline.sh
          echo 'Verified P479 direct-source repository created with immutable p479-baseline tag. No flash authorized.' >> "$GITHUB_STEP_SUMMARY"
